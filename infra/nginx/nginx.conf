# ONYX CTI - TLS 1.3 edge (report section 6: transport security).
# Terminates TLS in front of the dashboard and the API. Certificates are mounted, never baked in:
#   ./infra/nginx/certs/tls.crt and ./infra/nginx/certs/tls.key
# For a local test certificate:
#   openssl req -x509 -newkey rsa:4096 -nodes -days 30 -subj "/CN=localhost" \
#     -keyout infra/nginx/certs/tls.key -out infra/nginx/certs/tls.crt
events {}
http {
  server_tokens off;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_tickets off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /api/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
    location /graphql { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
    location /taxii2/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
    location /ws {
      proxy_pass http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      include /etc/nginx/proxy_params;
    }
    location / { proxy_pass http://frontend:3000; include /etc/nginx/proxy_params; }
  }
}
